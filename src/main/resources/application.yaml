fint:
  cron: "0 0 23 * * sun"
  adapter:
    username:
    password:
    id: https://fintlabs.no/ressurs
    base-url: https://beta.felleskomponent.no
    registration-id: fint
    org-id: fintlabs.no
    heartbeat-interval: 3
    capabilities:
      digitalenhet:
        domain-name: ressurs
        packageName: datautstyr
        resource-name: digitalenhet
        fullSyncIntervalInDays: 7
        deltaSyncInterval: IMMEDIATE
      enhetsgruppe:
        domain-name: ressurs
        packageName: datautstyr
        resource-name: Enhetsgruppe
        fullSyncIntervalInDays: 7
        deltaSyncInterval: IMMEDIATE
      enhetsgruppemedlemsskap:
        domain-name: ressurs
        packageName: datautstyr
        resource-name: Enhetsgruppemedlemsskap
        fullSyncIntervalInDays: 7
        deltaSyncInterval: IMMEDIATE
      Enhetstype:
        domain-name: ressurs
        packageName: kodeverk
        resource-name: Enhetstype
        fullSyncIntervalInDays: 7
        deltaSyncInterval: IMMEDIATE
      plattform:
        domain-name: ressurs
        packageName: kodeverk
        resource-name: plattform
        fullSyncIntervalInDays: 7
        deltaSyncInterval: IMMEDIATE
      stautus:
        domain-name: ressurs
        packageName: kodeverk
        resource-name: status
        fullSyncIntervalInDays: 7
        deltaSyncInterval: IMMEDIATE

spring:
  security:
    oauth2:
      client:
        provider:
          fint-idp:
            token-uri: https://idp.felleskomponent.no/nidp/oauth/nam/token?resourceServer=fint-api
        registration:
          fint:
            authorization-grant-type: password
            client-id: ${fint.adapter.client-id}
            client-secret: ${fint.adapter.client-secret}
            provider: fint-idp
            scope: fint-adapter