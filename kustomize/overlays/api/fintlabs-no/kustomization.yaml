apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fintlabs-no
resources:
  - ../../../base
commonLabels:
  app.kubernetes.io/name: fint-adapter-resource-vams
  app.kubernetes.io/instance: fint-adapter-resource-vams_fintlabs_no
  app.kubernetes.io/version: latest
  app.kubernetes.io/component: adapter
  app.kubernetes.io/part-of: fint-core
  fintlabs.no/team: core
  fintlabs.no/org-id: fintlabs.no


patches:
  - patch: |-
      - op: replace
        path: "/spec/orgId"
        value: "fintlabs.no"
      - op: replace
        path: "/spec/env/1/value"
        value: "https://api.felleskomponent.no"
      - op: replace
        path: "/spec/env/2/value"
        value: "fintlabs.no"
    target:
      kind: Job
      name: fint-adapter-resource-vams

  - patch: |-
      - op: replace
        path: "/spec/orgId"
        value: "fintlabs.no"
    target:
      kind: FintAdapter
      name: adapter-resource-vams
