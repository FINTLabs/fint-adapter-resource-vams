name: MD

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: Select an environment
        required: true
        type: choice
        options:
          - aks-api-fint-2022-02-08
          - aks-beta-fint-2021-11-23
      org:
        description: Select organisation
        required: true
        type: choice
        options:
          - fintlabs-no

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: ${{ inputs.cluster }}
  ORG: ${{ inputs.org }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get environment
        uses: actions/github-script@v9
        id: environment
        with:
          script: return '${{ env.CLUSTER_NAME }}'.split('-')[1]
          result-encoding: string

      - name: Get resource group name
        uses: actions/github-script@v9
        id: resource-group
        with:
          script: return 'rg-aks-${{ steps.environment.outputs.result }}'
          result-encoding: string

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,enable=true,priority=100,prefix=shaF-,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Bake manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@v4
        with:
          renderEngine: kustomize
          kustomizationPath: kustomize/overlays/${{ steps.environment.outputs.result }}/${{ env.ORG }}

      - name: Substitute image into baked YAML
        id: substitute
        uses: Azure/k8s-artifact-substitute@v2
        with:
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: ${{ steps.meta.outputs.tags }}

      - name: Copy substituted manifest into workspace
        id: bake-in-workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.baked"
          cp "${{ steps.substitute.outputs.manifests }}" "$GITHUB_WORKSPACE/.baked/manifest.yaml"
          echo "manifest=$GITHUB_WORKSPACE/.baked/manifest.yaml" >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', steps.environment.outputs.result)] }}"

      - name: Setup kubelogin
        uses: azure/use-kubelogin@v1.1
        with:
          kubelogin-version: v0.0.26

      - name: Set the target cluster
        uses: azure/aks-set-context@v5
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          resource-group: ${{ steps.resource-group.outputs.result }}
          admin: "true"
          use-kubelogin: "true"

      - name: Deploy
        uses: azure/k8s-deploy@v7.0.0
        with:
          action: deploy
          manifests: ${{ steps.bake-in-workspace.outputs.manifest }}
          namespace: ${{ env.ORG }}
          pull-images: false
